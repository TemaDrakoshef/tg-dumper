[project]
name = "tg-dumper"
version = "0.1.0"
description = "Software for parsing dialogs and their contents from telegram accounts in TDATA format"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "loguru>=0.7.3",
    "python-socks>=2.7.1",
    "rich>=14.0.0",
    "telethon>=1.39.0",
]

[dependency-groups]
dev = [
    "nuitka>=2.6.9",
    "ruff>=0.11.4",
]
